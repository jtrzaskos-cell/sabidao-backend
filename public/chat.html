<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat | Sabidão</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul: #3B82F6;
      --roxo: #8B5CF6;
      --preto: #0B0F1A;
      --preto-suave: #151A2B;
      --cinza: #94A3B8;
      --branco: #F8FAFC;
      --gradiente: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--preto);
      color: var(--branco);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 280px;
      background: #0d1117;
      border-right: 1px solid rgba(139, 92, 246, 0.15);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .sidebar-header {
      padding: 1.2rem;
      border-bottom: 1px solid rgba(139, 92, 246, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 800;
      background: var(--gradiente);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-nova {
      background: transparent;
      border: 1px solid rgba(139, 92, 246, 0.35);
      color: var(--cinza);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-nova:hover {
      border-color: var(--roxo);
      color: white;
    }

    .lista-conversas {
      flex: 1;
      overflow-y: auto;
      padding: 0.8rem;
    }

    .conversa-item {
      padding: 0.85rem 1rem;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 0.4rem;
      transition: background 0.2s;
      border: 1px solid transparent;
    }

    .conversa-item:hover {
      background: rgba(139, 92, 246, 0.1);
      border-color: rgba(139, 92, 246, 0.2);
    }

    .conversa-item .titulo {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.25rem;
    }

    .conversa-item .data {
      font-size: 0.75rem;
      color: var(--cinza);
    }

    .sidebar-footer {
      padding: 1rem;
      border-top: 1px solid rgba(139, 92, 246, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--cinza);
    }

    .btn-sair {
      background: transparent;
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: var(--cinza);
      padding: 0.35rem 0.7rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-sair:hover { color: white; }

    /* ===== CHAT PRINCIPAL ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .mensagem {
      max-width: 75%;
      padding: 0.9rem 1.2rem;
      border-radius: 18px;
      line-height: 1.55;
      animation: aparecer 0.3s ease;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .aluno {
      background: rgba(139, 92, 246, 0.18);
      border: 1px solid rgba(139, 92, 246, 0.25);
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .sabidao {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.2);
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    .nome {
      font-size: 0.75rem;
      font-weight: 600;
      opacity: 0.7;
      margin-bottom: 4px;
    }

    .input-area {
      padding: 1.2rem 2rem 1.5rem;
      border-top: 1px solid rgba(139, 92, 246, 0.12);
      background: var(--preto);
    }

    textarea {
      width: 100%;
      padding: 1rem 1.2rem;
      border-radius: 16px;
      border: 1px solid rgba(139, 92, 246, 0.25);
      background: rgba(255,255,255,0.04);
      color: white;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
      resize: none;
      height: 80px;
      margin-bottom: 0.8rem;
    }

    textarea:focus { border-color: var(--roxo); }

    #btnEnviar {
      width: 100%;
      padding: 0.95rem;
      border: none;
      border-radius: 14px;
      background: var(--gradiente);
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }

    #btnEnviar:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ===== AUTH ===== */
    #auth-screen {
      position: fixed;
      inset: 0;
      background: var(--preto);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .auth-box {
      background: var(--preto-suave);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
    }

    .auth-box h2 {
      text-align: center;
      margin-bottom: 0.5rem;
      font-size: 1.6rem;
    }

    .auth-box p {
      text-align: center;
      color: var(--cinza);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .auth-box input, .auth-box select {
      width: 100%;
      padding: 0.9rem 1.1rem;
      margin-bottom: 1rem;
      border-radius: 12px;
      border: 1px solid rgba(139, 92, 246, 0.25);
      background: rgba(255,255,255,0.04);
      color: white;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }

    .auth-box button {
      width: 100%;
      padding: 0.95rem;
      border: none;
      border-radius: 12px;
      background: var(--gradiente);
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .auth-toggle {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--cinza);
    }

    .auth-toggle span {
      color: var(--azul);
      cursor: pointer;
      font-weight: 600;
    }

    .erro-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 0.8rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }

    .vazio {
      text-align: center;
      color: var(--cinza);
      padding: 2rem 1rem;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN / CADASTRO -->
  <div id="auth-screen">
    <div class="auth-box">
      <h2 id="auth-titulo">Entrar no Sabidão</h2>
      <p id="auth-subtitulo">Acesse sua conta para continuar</p>
      <div class="erro-msg" id="erro-msg"></div>

      <div id="form-login">
        <input type="email" id="login-email" placeholder="Seu e-mail">
        <input type="password" id="login-senha" placeholder="Sua senha">
        <button onclick="fazerLogin()">Entrar</button>
        <div class="auth-toggle">
          Não tem conta? <span onclick="mostrarCadastro()">Cadastre-se</span>
        </div>
      </div>

      <div id="form-cadastro" style="display: none;">
        <input type="text" id="cadastro-nome" placeholder="Seu nome">
        <input type="email" id="cadastro-email" placeholder="Seu e-mail">
        <input type="password" id="cadastro-senha" placeholder="Crie uma senha">
        <select id="cadastro-tipo">
          <option value="aluno">Sou Aluno</option>
          <option value="professor">Sou Professor</option>
          <option value="pais">Sou Responsável</option>
        </select>
        <button onclick="fazerCadastro()">Criar conta</button>
        <div class="auth-toggle">
          Já tem conta? <span onclick="mostrarLogin()">Fazer login</span>
        </div>
      </div>
    </div>
  </div>

  <!-- APP PRINCIPAL -->
  <div id="app" style="display: none; width: 100%; height: 100%; display: none;">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="logo">Sabidão</div>
        <button class="btn-nova" onclick="novaConversa()">+ Nova</button>
      </div>

      <div class="lista-conversas" id="lista-conversas">
        <div class="vazio">Carregando conversas...</div>
      </div>

      <div class="sidebar-footer">
        <span id="nome-usuario"></span>
        <button class="btn-sair" onclick="sair()">Sair</button>
      </div>
    </div>

    <!-- CHAT -->
    <div class="main">
      <div id="chat">
        <div class="mensagem sabidao">
          <div class="nome">Sabidão</div>
          Olá! Eu sou o Sabidão 🦉<br>
          Pode me perguntar qualquer dúvida de estudo. Estou aqui para te ajudar!
        </div>
      </div>

      <div class="input-area">
        <textarea id="pergunta" placeholder="Digite sua dúvida aqui..."></textarea>
        <button id="btnEnviar" onclick="enviarPergunta()">Enviar pergunta</button>
      </div>
    </div>
  </div>

  <script>
    let usuarioLogado = null;

    // Verificar login salvo
    const salvo = localStorage.getItem('sabidao_usuario');
    if (salvo) {
      usuarioLogado = JSON.parse(salvo);
      mostrarApp();
    }

    function mostrarCadastro() {
      document.getElementById('form-login').style.display = 'none';
      document.getElementById('form-cadastro').style.display = 'block';
      document.getElementById('auth-titulo').innerText = 'Criar conta';
      document.getElementById('auth-subtitulo').innerText = 'Preencha os dados para se cadastrar';
      document.getElementById('erro-msg').style.display = 'none';
    }

    function mostrarLogin() {
      document.getElementById('form-cadastro').style.display = 'none';
      document.getElementById('form-login').style.display = 'block';
      document.getElementById('auth-titulo').innerText = 'Entrar no Sabidão';
      document.getElementById('auth-subtitulo').innerText = 'Acesse sua conta para continuar';
      document.getElementById('erro-msg').style.display = 'none';
    }

    function mostrarErro(msg) {
      const el = document.getElementById('erro-msg');
      el.innerText = msg;
      el.style.display = 'block';
    }

    async function fazerCadastro() {
      const nome = document.getElementById('cadastro-nome').value.trim();
      const email = document.getElementById('cadastro-email').value.trim();
      const senha = document.getElementById('cadastro-senha').value;
      const tipo = document.getElementById('cadastro-tipo').value;

      if (!nome || !email || !senha) return mostrarErro('Preencha todos os campos');

      try {
        const res = await fetch('/api/cadastro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, senha, tipo })
        });
        const dados = await res.json();

        if (dados.sucesso) {
          usuarioLogado = dados.usuario;
          localStorage.setItem('sabidao_usuario', JSON.stringify(usuarioLogado));
          mostrarApp();
        } else {
          mostrarErro(dados.erro || 'Erro ao cadastrar');
        }
      } catch (e) {
        mostrarErro('Erro de conexão com o servidor');
      }
    }

    async function fazerLogin() {
      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-senha').value;

      if (!email || !senha) return mostrarErro('Preencha e-mail e senha');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, senha })
        });
        const dados = await res.json();

        if (dados.sucesso) {
          usuarioLogado = dados.usuario;
          localStorage.setItem('sabidao_usuario', JSON.stringify(usuarioLogado));
          mostrarApp();
        } else {
          mostrarErro(dados.erro || 'Erro ao fazer login');
        }
      } catch (e) {
        mostrarErro('Erro de conexão com o servidor');
      }
    }

    function mostrarApp() {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      document.getElementById('nome-usuario').innerText = usuarioLogado.nome;
      carregarHistorico();
    }

    function sair() {
      localStorage.removeItem('sabidao_usuario');
      location.reload();
    }

    function novaConversa() {
      document.getElementById('chat').innerHTML = `
        <div class="mensagem sabidao">
          <div class="nome">Sabidão</div>
          Olá! Eu sou o Sabidão 🦉<br>
          Pode me perguntar qualquer dúvida de estudo. Estou aqui para te ajudar!
        </div>
      `;
    }

    async function carregarHistorico() {
      const lista = document.getElementById('lista-conversas');
      lista.innerHTML = '<div class="vazio">Carregando...</div>';

      try {
        const res = await fetch(`/api/historico?aluno=${encodeURIComponent(usuarioLogado.nome)}`);
        const mensagens = await res.json();

        if (!mensagens.length) {
          lista.innerHTML = '<div class="vazio">Nenhuma conversa ainda.<br>Faça sua primeira pergunta!</div>';
          return;
        }

        lista.innerHTML = '';
        mensagens.forEach(msg => {
          const item = document.createElement('div');
          item.className = 'conversa-item';
          item.onclick = () => carregarConversa(msg);

          const data = new Date(msg.data).toLocaleDateString('pt-BR', {
            day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
          });

          item.innerHTML = `
            <div class="titulo">${msg.pergunta.substring(0, 45)}${msg.pergunta.length > 45 ? '...' : ''}</div>
            <div class="data">${data}</div>
          `;
          lista.appendChild(item);
        });
      } catch (e) {
        lista.innerHTML = '<div class="vazio">Erro ao carregar conversas</div>';
      }
    }

    function carregarConversa(msg) {
      document.getElementById('chat').innerHTML = `
        <div class="mensagem aluno">
          <div class="nome">${msg.aluno}</div>
          ${msg.pergunta.replace(/\n/g, '<br>')}
        </div>
        <div class="mensagem sabidao">
          <div class="nome">Sabidão</div>
          ${msg.resposta.replace(/\n/g, '<br>')}
        </div>
      `;
    }

    async function enviarPergunta() {
      const pergunta = document.getElementById('pergunta').value.trim();
      if (!pergunta) return alert('Digite uma pergunta!');

      adicionarMensagem(usuarioLogado.nome, pergunta, 'aluno');
      document.getElementById('pergunta').value = '';

      const btn = document.getElementById('btnEnviar');
      btn.disabled = true;
      btn.innerText = 'Sabidão está pensando...';

      try {
        const res = await fetch('/api/perguntar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            pergunta,
            aluno: usuarioLogado.nome
          })
        });

        const dados = await res.json();

        if (dados.sucesso) {
          adicionarMensagem('Sabidão', dados.resposta, 'sabidao');
          carregarHistorico(); // atualiza a sidebar
        } else {
          adicionarMensagem('Sabidão', 'Desculpe, ocorreu um erro.', 'sabidao');
        }
      } catch (e) {
        adicionarMensagem('Sabidão', 'Erro de conexão.', 'sabidao');
      }

      btn.disabled = false;
      btn.innerText = 'Enviar pergunta';
    }

    function adicionarMensagem(nome, texto, tipo) {
      const div = document.createElement('div');
      div.className = `mensagem ${tipo}`;
      div.innerHTML = `<div class="nome">${nome}</div>${texto.replace(/\n/g, '<br>')}`;
      const chat = document.getElementById('chat');
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('pergunta').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        enviarPergunta();
      }
    });
  </script>
</body>
</html>
