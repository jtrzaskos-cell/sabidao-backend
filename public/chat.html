<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat | Sabidão</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul: #3B82F6;
      --roxo: #8B5CF6;
      --preto: #0B0F1A;
      --preto-suave: #151A2B;
      --cinza: #94A3B8;
      --branco: #F8FAFC;
      --gradiente: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--preto);
      color: var(--branco);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(11, 15, 26, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(139, 92, 246, 0.15);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 800;
      background: var(--gradiente);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .voltar {
      color: var(--cinza);
      text-decoration: none;
      font-size: 0.95rem;
    }

    .voltar:hover { color: white; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .mensagem {
      max-width: 80%;
      padding: 0.9rem 1.2rem;
      border-radius: 18px;
      line-height: 1.5;
      animation: aparecer 0.3s ease;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .aluno {
      background: rgba(139, 92, 246, 0.18);
      border: 1px solid rgba(139, 92, 246, 0.25);
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .sabidao {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.2);
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    .nome {
      font-size: 0.75rem;
      font-weight: 600;
      opacity: 0.7;
      margin-bottom: 4px;
    }

    .input-area {
      padding: 1.2rem 1.5rem;
      background: var(--preto-suave);
      border-top: 1px solid rgba(139, 92, 246, 0.15);
    }

    .input-group {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 0.8rem;
    }

    input, textarea {
      width: 100%;
      padding: 0.9rem 1.1rem;
      border-radius: 14px;
      border: 1px solid rgba(139, 92, 246, 0.25);
      background: rgba(255,255,255,0.04);
      color: white;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      border-color: var(--roxo);
    }

    textarea {
      resize: none;
      height: 80px;
    }

    button {
      width: 100%;
      padding: 0.95rem;
      border: none;
      border-radius: 14px;
      background: var(--gradiente);
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(139, 92, 246, 0.35);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Sabidão</div>
    <a href="index.html" class="voltar">← Voltar</a>
  </header>

  <div id="chat">
    <div class="mensagem sabidao">
      <div class="nome">Sabidão</div>
      Olá! Eu sou o Sabidão 🦉<br>
      Pode me perguntar qualquer dúvida de estudo. Estou aqui para te ajudar!
    </div>
  </div>

  <div class="input-area">
    <div class="input-group">
      <input type="text" id="aluno" placeholder="Seu nome (opcional)">
    </div>
    <textarea id="pergunta" placeholder="Digite sua dúvida aqui..."></textarea>
    <br><br>
    <button id="btnEnviar" onclick="enviarPergunta()">Enviar pergunta</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const btn = document.getElementById('btnEnviar');

    async function enviarPergunta() {
      const pergunta = document.getElementById('pergunta').value.trim();
      const aluno = document.getElementById('aluno').value.trim() || 'Aluno';

      if (!pergunta) {
        alert('Digite uma pergunta!');
        return;
      }

      adicionarMensagem(aluno, pergunta, 'aluno');
      document.getElementById('pergunta').value = '';

      btn.disabled = true;
      btn.innerText = 'Sabidão está pensando...';

      try {
        const resposta = await fetch('/api/perguntar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pergunta, aluno })
        });

        const dados = await resposta.json();

        if (dados.sucesso) {
          adicionarMensagem('Sabidão', dados.resposta, 'sabidao');
        } else {
          adicionarMensagem('Sabidão', 'Desculpe, ocorreu um erro. Tente novamente.', 'sabidao');
        }
      } catch (erro) {
        adicionarMensagem('Sabidão', 'Não consegui me conectar ao servidor.', 'sabidao');
        console.error(erro);
      }

      btn.disabled = false;
      btn.innerText = 'Enviar pergunta';
    }

    function adicionarMensagem(nome, texto, tipo) {
      const div = document.createElement('div');
      div.className = `mensagem ${tipo}`;
      div.innerHTML = `<div class="nome">${nome}</div>${texto.replace(/\n/g, '<br>')}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById('pergunta').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        enviarPergunta();
      }
    });
  </script>
</body>
</html>
